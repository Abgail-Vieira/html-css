<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container{
            background-color: crimson;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            
        }

        .item{
            background-color: rgb(205, 160, 241);
            border: 1px solid black;
            text-align: center;
            padding: 5px;
            
        }

        .container2{
            background-color: rgb(20, 210, 220);
            display: flex;
            height: 300px;
            flex-flow: row nowrap;
            justify-content: space-evenly;
            align-items: stretch ;
            
        }

        .item{
            background-color: rgb(205, 160, 241);
            border: 1px solid black;
            text-align: center;
            padding: 5px;
            
        }
    </style>
</head>
<body>
    <h1>Alinhamento nos eixos Flexbox</h1>

    <h2>Exemplo Justify-content: Row</h2>
    <p>Alinha sempre o main-axis.</p>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div><br>

    <h2>Exemplo Align-items: Column</h2>
    <p>Alinha sempre os itens no cross-axis.</p>
    <div class="container2">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 300px;
            border-collapse: collapse;
            
           
        }

        td{
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

    .B{
            background-color: red;
        }

    .D{
            background-color: Blue;
        }

    .F{
            background-color: yellow;
        }
    .M{
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de tabelas</h1>
    <table>
        <caption>Tabela Simples</caption>
        <tr>
            <td>A</td>
            <td class="B">B</td>
            <td>C</td>
        </tr>
        <tr>
            <td class="D">D</td>
            <td>E</td>
            <td class="F">F</td>
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr >
        <tr>
            <td>J</td>
            <td>L</td>
            <td class="M">M</td>
        </tr>

    </table><br><br>

    <table>
        <caption>Tabela Mesclada</caption>
        <tr>
            <td>A</td>
            <td colspan="2" class="B">B</td>
        </tr>
        <tr>
            <td rowspan="3" class="D">D</td>
            <td>E</td>
            <td rowspan="2" class="F">F</td>
        </tr>
        <tr>
            <td>H</td>
            
        </tr>
        <tr>
            <td colspan="2" class="M">M</td>
        </tr>

    </table>
    
</body>
</html>
